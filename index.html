<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.T.E.R.L.I.N.G. Sovereign Matrix</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #05070a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: #ffffff;
            padding: 20px;
        }
        .matrix-viewport {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            height: auto;
            flex-grow: 1;
        }
        .orb-container {
            position: relative;
            width: 42vmin;
            height: 42vmin;
            min-width: 220px;
            min-height: 220px;
            max-width: 360px;
            max-height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .orb-glow {
            position: absolute;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,255,0.35) 0%, rgba(0,0,0,0) 70%);
            filter: blur(15px);
            z-index: 1;
        }
        canvas { position: absolute; width: 100% !important; height: 100% !important; z-index: 2; }
        .status-text {
            margin-top: 4vh;
            font-size: calc(0.55rem + 0.5vmin);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #516d82;
            font-weight: 600;
            text-align: center;
            user-select: none;
        }
        .active-listening { color: #00d4ff; text-shadow: 0 0 12px rgba(0,212,255,0.6); }
        .wake-word-ready { color: #39ff14; text-shadow: 0 0 10px rgba(57,255,20,0.4); }

        /* 🖥️ SOVEREIGN DEVICE COCKPIT PANEL */
        .cockpit-panel {
            width: 100%;
            max-width: 900px;
            background: rgba(10, 15, 22, 0.7);
            border: 1px solid rgba(81, 109, 130, 0.2);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }
        .cockpit-header {
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #516d82;
            margin-bottom: 10px;
            font-weight: 700;
            border-bottom: 1px solid rgba(81, 109, 130, 0.1);
            padding-bottom: 5px;
        }
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            max-height: 120px;
            overflow-y: auto;
        }
        .device-card {
            background: rgba(5, 7, 10, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .device-info { font-size: 0.75rem; font-weight: 500; color: #ffffff; }
        .device-type { font-size: 0.6rem; color: #516d82; text-transform: uppercase; }
        .indicator-pulse {
            width: 6px;
            height: 6px;
            background-color: #39ff14;
            border-radius: 50%;
            box-shadow: 0 0 8px #39ff14;
        }
    </style>
</head>
<body>
    <div class="matrix-viewport">
        <div class="orb-container" id="trigger-zone">
            <div class="orb-glow" id="glow-matrix"></div>
            <canvas id="voice-orb" width="400" height="400"></canvas>
        </div>
        <div class="status-text" id="system-status">WAKING NETWORK MATRIX...</div>
    </div>

    <div class="cockpit-panel">
        <div class="cockpit-header">⚡ Sovereign Connected Matrix Devices</div>
        <div class="device-grid" id="device-display-grid">
            <div class="device-card"><div class="device-info">Cloud Tower<div class="device-type">Render Server</div></div><div class="indicator-pulse"></div></div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('voice-orb');
        const ctx = canvas.getContext('2d');
        const systemStatus = document.getElementById('system-status');
        const glowMatrix = document.getElementById('glow-matrix');
        const triggerZone = document.getElementById('trigger-zone');
        const deviceGrid = document.getElementById('device-display-grid');

        let isListening = false;
        let isSpeaking = false;
        let wakeWordLoopActive = false;
        let animationFrameId, audioContext, analyser, dataArray;
        let baseRadius = 80; let pulseMultiplier = 0;
        const deviceSignatureID = "director_mobile_matrix";

        function speakResponse(textToSay) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(textToSay);
                utterance.lang = 'en-US'; utterance.rate = 1.05; utterance.pitch = 0.95; 
                utterance.onstart = () => {
                    isSpeaking = true;
                    systemStatus.innerText = "S.T.E.R.L.I.N.G. : SPEAKING";
                    systemStatus.className = "status-text active-listening";
                };
                utterance.onend = () => {
                    isSpeaking = false;
                    resetToAmbientWakeState();
                };
                window.speechSynthesis.speak(utterance);
            }
        }

        // 🎛️ COCKPIT MATRIX: FETCH CONNECTED SYSTEM DEVICES
        async function refreshConnectedDevicesCockpit() {
            try {
                // Queries the base server heartbeat mapping registry to gather device nodes
                const response = await fetch('/api/v1/matrix/heartbeat?device_id=ui_cockpit&device_type=PANEL', {
                    method: 'POST',
                    headers: { 'X-Sterling-Auth': 'omwony213' }
                });
                if (response.ok) {
                    // Update display layout with mock / fetched server cache data dynamically
                    deviceGrid.innerHTML = `
                        <div class="device-card"><div class="device-info">Cloud Tower<div class="device-type">Render Server</div></div><div class="indicator-pulse"></div></div>
                        <div class="device-card"><div class="device-info">Director Platform<div class="device-type">Active UI Console</div></div><div class="indicator-pulse"></div></div>
                        <div class="device-card"><div class="device-info">Tenda Node AP<div class="device-type">Mesh Firmware Node</div></div><div class="indicator-pulse"></div></div>
                    `;
                }
            } catch(e) {}
        }

        function drawOrb(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2; const centerY = canvas.height / 2;
            if (isListening && analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0; for(let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                pulseMultiplier = (sum / dataArray.length) * 0.8;
            } else if (isSpeaking) {
                pulseMultiplier = 15 + Math.sin(time * 0.02) * 8;
            } else if (wakeWordLoopActive) {
                pulseMultiplier = Math.sin(time * 0.001) * 3; // Ultra-low-power sentinel pulse
            } else { pulseMultiplier = Math.sin(time * 0.003) * 5; }

            let currentRadius = baseRadius + pulseMultiplier;
            ctx.beginPath(); ctx.arc(centerX, centerY, currentRadius + 25, 0, Math.PI * 2);
            ctx.strokeStyle = (isListening || isSpeaking) ? 'rgba(0, 212, 255, 0.15)' : 'rgba(81, 109, 130, 0.1)';
            ctx.lineWidth = 1.5; ctx.stroke();

            ctx.beginPath(); ctx.arc(centerX, centerY, currentRadius, 0, Math.PI * 2);
            ctx.strokeStyle = isListening ? 'rgba(0, 212, 255, 0.85)' : (isSpeaking ? 'rgba(0, 212, 255, 0.9)' : 'rgba(81, 109, 130, 0.45)');
            ctx.lineWidth = 4; ctx.shadowBlur = (isListening || isSpeaking) ? 20 : 0; ctx.shadowColor = '#00d4ff'; ctx.stroke(); ctx.shadowBlur = 0; 
            animationFrameId = requestAnimationFrame(drawOrb);
        }

        // 🎙️ ALWAYS-LISTENING SENTINEL WAKE WORD ENGINE
        function initializeWakeWordSentinel() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            const sentinel = new SpeechRecognition();
            sentinel.continuous = false; sentinel.interimResults = false; sentinel.lang = 'en-US';

            sentinel.onstart = () => {
                wakeWordLoopActive = true;
                if (!isListening && !isSpeaking) {
                    systemStatus.innerText = "AWAITING WAKE COMMAND ['STERLING']...";
                    systemStatus.className = "status-text wake-word-ready";
                }
            };

            sentinel.onresult = (event) => {
                const speechResult = event.results[0][0].transcript.toLowerCase();
                // Check if the caller invoked your butler's signature wake word name
                if (speechResult.includes("sterling")) {
                    wakeWordLoopActive = false;
                    triggerVoiceCommandCapture(); // Transition straight into listening mode instantly
                }
            };

            sentinel.onend = () => {
                // Loops itself continuously in the background to ensure it stays vigilant
                if (!isListening && !isSpeaking) sentinel.start();
            };
            sentinel.start();
        }

        async function triggerVoiceCommandCapture() {
            try {
                isListening = true;
                systemStatus.innerText = "S.T.E.R.L.I.N.G. : ONLINE & LISTENING";
                systemStatus.className = "status-text active-listening";
                
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.continuous = false; recognition.lang = 'en-US';

                recognition.onresult = async (event) => {
                    const speechResult = event.results[0][0].transcript.toLowerCase();
                    systemStatus.innerText = "ROUTING COMPILATION DIRECTIVE...";

                    if (speechResult.includes("police") || speechResult.includes("dispatch")) {
                        try {
                            await fetch(`/api/v1/matrix/dispatch-police/${deviceSignatureID}`, { method: 'POST', headers: { 'X-Sterling-Auth': 'omwony213' } });
                            speakResponse("Emergency criteria mapped, Director. Dispatch vectors pushed.");
                            return;
                        } catch(e) {}
                    }

                    try {
                        // Forward dynamic code snippet actions straight down to target command processing queues
                        await fetch('/api/v1/matrix/execute-command', {
                            method: 'POST',
                            headers: { 'X-Sterling-Auth': 'omwony213', 'Content-Type': 'application/json' },
                            body: JSON.stringify({ target_device: "my_main_laptop", action: speechResult })
                        });
                        speakResponse("Directive routed successfully, Sir.");
                    } catch (e) {
                        speakResponse("Matrix connection drop hit.");
                    }
                };

                recognition.onerror = () => { resetToAmbientWakeState(); };
                recognition.onend = () => { isListening = false; };
                recognition.start();
            } catch (err) { resetToAmbientWakeState(); }
        }

        function resetToAmbientWakeState() {
            isListening = false; isSpeaking = false;
            systemStatus.innerText = "AWAITING WAKE COMMAND ['STERLING']...";
            systemStatus.className = "status-text wake-word-ready";
            initializeWakeWordSentinel();
        }

        // Initialize mic stream metrics on click for visual canvas frequencies
        triggerZone.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser(); analyser.fftSize = 64;
                source.connect(analyser); dataArray = new Uint8Array(analyser.frequencyBinCount);
                resetToAmbientWakeState();
            } catch(e) { alert("Optics authorization failed."); }
        });

        animationFrameId = requestAnimationFrame(drawOrb);
        refreshConnectedDevicesCockpit();
        setInterval(refreshConnectedDevicesCockpit, 15000); // Poll cockpit statuses every 15 seconds
    </script>
</body>
</html>
